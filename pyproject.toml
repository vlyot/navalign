[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "navalign"
version = "0.1.0"
description = "Navigation-alignment scoring for coding-agent traces"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kai" }]
requires-python = ">=3.11"
keywords = ["coding agents", "agent evaluation", "code localization", "SWE-bench", "ATIF"]
dependencies = ["networkx>=3.4", "unidiff>=0.7", "pandas>=2.1", "numpy>=1.26"]

[project.urls]
Repository = "https://github.com/vlyot/navalign"
Documentation = "https://github.com/vlyot/navalign/tree/main/docs"

[project.scripts]
navalign = "navalign.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]
analysis = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
navalign = ["examples/toy/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
