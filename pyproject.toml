[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navalign"
version = "0.1.0"
description = "Navigation-alignment scoring for coding-agent traces"
requires-python = ">=3.10"
dependencies = ["networkx>=3.4", "unidiff>=0.7", "pandas>=2.1", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
